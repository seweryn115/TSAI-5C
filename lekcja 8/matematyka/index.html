<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <span class="first">
            <input type="button" value="Stozek" id="stozek1">
        </span>
        <form id="stozek2">
            <label for="promien">Podaj promień podstawy stozka</label>
            <input type="number" name="promien" id="promien_stozek">

            <label for="wysokosc">Podaj wysokosc stozka</label>
            <input type="number" name="wysokosc" id="wysokosc_stozek">

            <label for="tworząca">Podaj tworzącą stozka</label>
            <input type="number" name="tworząca" id="tworząca_stozek">
        </form>

        <span class="second">
            <input type="button" value="kula" id="kula1">
        </span>
        <form id="kula2">
            <label for="promien">Podaj promień kuli</label>
            <input type="number" name="promien" id="promien_kula">
        </form>

        <span class="third">
            <input type="button" value="ostroslup" id="ostroslup1">
        </span>
        <form id="ostroslup2">
            <label for="podstawa">Podaj długość podstawy ostrosłupa</label>
            <input type="number" name="podstawa" id="podstawa_ostroslup">
            <label for="wysokosc">Podaj wysokość ostrosłupa</label>
            <input type="number" name="wysokosc" id="wysokosc_ostroslup">
        </form>
    </main>
<script src="script.js"></script> 
</body>

</html>
